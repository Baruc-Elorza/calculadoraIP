<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Calculadora de subredes IPv4</title>
</h:head>
<h:body>
    <h1>Calculadora de subredes IPv4</h1>
    <h:form>
        <h:messages />

        <h:link outcome="/historial.xhtml" value="Ver historial" />
        <br /><br />

        <h:panelGrid id="componente" columns="2" border="1">
            <h:outputLabel for="ip" value="Dirección IPv4:" />
            <h:inputText id="ip" value="#{subredBean.ip}" />

            <h:outputLabel for="prefijo" value="Prefijo CIDR (0–32):" />
            <h:selectOneMenu id="prefijo" value="#{subredBean.prefijo}">
                <f:selectItem itemLabel="-- Selecciona --" itemValue="#{null}"
                              noSelectionOption="true" />
                <f:selectItems value="#{subredBean.prefijos}" var="p"
                               itemValue="#{p}" itemLabel="/#{p}" />
            </h:selectOneMenu>

            <h:outputLabel value="Datos a mostrar:" />
            <h:selectManyCheckbox id="campos" value="#{subredBean.campos}"
                                  layout="pageDirection">
                <f:selectItem itemValue="mascara" itemLabel="Máscara" />
                <f:selectItem itemValue="red" itemLabel="Dirección de red" />
                <f:selectItem itemValue="broadcast" itemLabel="Broadcast" />
                <f:selectItem itemValue="primera" itemLabel="Primera IP utilizable" />
                <f:selectItem itemValue="ultima" itemLabel="Última IP utilizable" />
                <f:selectItem itemValue="total" itemLabel="Total de direcciones" />
                <f:selectItem itemValue="hosts" itemLabel="Hosts utilizables" />
            </h:selectManyCheckbox>
        </h:panelGrid>

        <h:commandButton value="Calcular subred" action="#{subredBean.calcular}" />

        <h:panelGroup layout="block" rendered="#{not empty subredBean.error}">
            <p><h:outputText value="#{subredBean.error}" /></p>
        </h:panelGroup>

    </h:form>
</h:body>
</html>
